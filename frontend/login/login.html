<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title></title>
	<link rel="stylesheet" href="login.css">
	<script src="login.js" defer></script>
</head>
<body>
	<form id="login-form" action="">
		<div id="login-form-flex">
			<h2>Login:</h2>

			<label
			for="username-email-login">Username or Email:</label>
			<input
			id="username-email-login"
   			class="mb"
			name="usernameOrEmail"
			type="text">

			<label
			for="password-login">Password:</label>
			<input
			id="password-login"
   			class="mb"
			name="password"
			type="password">

			<button type="submit">Log in</button>
		</div>
	</form>
	
</body>
</html>
