<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title></title>
	<link rel="stylesheet" href="register.css">
	<script src="register.js" defer></script>
</head>
<body>
	<form id="register-form" action="">
		<div id="register-form-flex">
			<h2>Register:</h2>
			<label for="username-field">Username:</label>
			<input
			id="username-field"
   			class="mb"
			name="username"
			type="text"
			maxlength="40">

			<label for="email-field">Email:</label>
			<input
			id="email-field"
   			class="mb"
			name="email"
			type="text"
			maxlength="40">

			<label for="mascot-field">Mascot:</label>
			<input
			id="mascot-field"
   			class="mb"
			name="mascot"
			type="text"
			maxlength="40">

			<label for="bio-field">Bio:</label>
			<textarea
			id="bio-field"
   			class="mb"
			name="bio"
			cols="30"
			rows="10"></textarea>

			<label for="password-field">Password:</label>
			<input
			id="password-field"
   			class="mb"
			name="password"
			type="text"
			maxlength="40">

			<label for="confirm-password-field">Confirm Password:</label>
			<input
			id="confirm-password-field"
   			class="mb"
			name="confirm-password"
			type="text"
			maxlength="40">

			<button
			type="submit">Register</button>
		</div>
	</form>
</body>
</html>
