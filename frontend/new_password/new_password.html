<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title></title>
	<link rel="stylesheet" href="new_password.css">
	<script src="new_password.js" defer></script>
</head>
<body>
	<form id="new-password-form" action="">
		<div id="new-password-form-flex">
			<h2>Change Password:</h2>
			<label for="old-password-field">Old Password:</label>
			<input
			id="old-password-field"
   			class="mb"
			name="old-password"
			type="text"
			maxlength="40">

			<label for="new-password-field">New Password:</label>
			<input
			id="new-password-field"
   			class="mb"
			name="new-password"
			type="text"
			maxlength="40">

			<label for="confirm-new-password-field">Confirm New Password:</label>
			<input
			id="confirm-new-password-field"
   			class="mb"
			name="confirm-new-password"
			type="text"
			maxlength="40">

			<button
			type="submit">Submit</button>
		</div>
	</form>
</body>
</html>
