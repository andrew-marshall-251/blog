<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title></title>
	<link rel="stylesheet" href="new_post.css">
	<script src="new_post.js" defer></script>
</head>
<body>

	<div id="new-post-container">
		<div id="new-post-flex">
			<h2>New Post</h2>
			
			<label for="post-title">Post Title:</label>
			<input 
			id="post-title"
			class="text-input mb"
			type="text"
			maxlength="150">
			
			<label for="editor">Post Body:</label>
			<textarea
			id="editor"
			class="mb"
			name="text-editor"
			cols="30"
			rows="10"
			maxlength="2000"></textarea>
			
			<button
			id="new-post-submit"
			type="submit">Post</button>
		</div>
	</div>
</body>
</html>
